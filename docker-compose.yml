version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecronabrand-postgres
    environment:
      POSTGRES_USER: ecronabrand
      POSTGRES_PASSWORD: ecronabrand_dev_password
      POSTGRES_DB: ecronabrand
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecronabrand"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecronabrand-network

  redis:
    image: redis:7-alpine
    container_name: ecronabrand-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecronabrand-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecronabrand-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ecronabrand:ecronabrand_dev_password@postgres:5432/ecronabrand
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: your-secret-key-change-in-production
      FRONTEND_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - ecronabrand-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecronabrand-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - ecronabrand-network

volumes:
  postgres_data:

networks:
  ecronabrand-network:
    driver: bridge
